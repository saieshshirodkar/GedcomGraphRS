[package]
name = "gedcomgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GEDCOM family tree layout engine"
license = "MIT"

[lib]
name = "gedcomgraph"
path = "src/lib.rs"

[[bin]]
name = "gedcomgraph"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
